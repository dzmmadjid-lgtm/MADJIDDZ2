name: "Strict Dynamic Android Builder"

'on':
  push:
    branches:
      - "main"
      - "master"
  workflow_dispatch:
    inputs:
      target_zip:
        description: "Specific ZIP filename to build"
        required: false
        default: ""
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: "1. Checkout Repository"
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1

      - name: "2. Locate and Verify Target Project"
        id: verify_step
        run: |
          echo "========================================================"
          echo "AUDIT: VALIDATING TARGET PROJECT ZIP FILE"
          echo "========================================================"
          
          SPECIFIED_ZIP="${{ github.event.inputs.target_zip }}"
          CHOSEN_ZIP=""
          
          if [ -n "$SPECIFIED_ZIP" ]; then
            echo "Explicit target project requested: '$SPECIFIED_ZIP'"
            if [ -f "$SPECIFIED_ZIP" ]; then
              CHOSEN_ZIP="$SPECIFIED_ZIP"
            else
              echo "ERROR: Requested file '$SPECIFIED_ZIP' was NOT found in repository!"
              exit 1
            fi
          else
            ZIP_COUNT=$(find . -maxdepth 2 -type f -name "*.zip" | wc -l)
            if [ "$ZIP_COUNT" -gt 0 ]; then
              CHOSEN_ZIP=$(find . -maxdepth 2 -type f -name "*.zip" -printf '%T@ %p\n' | sort -n | tail -1 | cut -f2- -d" ")
              echo "Auto-selected newest ZIP archive: $CHOSEN_ZIP"
            else
              echo "Using direct repository source."
            fi
          fi

          if [ -n "$CHOSEN_ZIP" ] && [ -f "$CHOSEN_ZIP" ]; then
            FILE_SIZE=$(ls -lh "$CHOSEN_ZIP" | awk '{print $5}')
            echo "TRANSFERRED_FILE=$CHOSEN_ZIP" >> $GITHUB_ENV
            echo "TRANSFERRED_FILE_SIZE=$FILE_SIZE" >> $GITHUB_ENV
            echo "IS_ZIP=true" >> $GITHUB_ENV
          else
            echo "TRANSFERRED_FILE=Direct-Repo-Source" >> $GITHUB_ENV
            echo "TRANSFERRED_FILE_SIZE=N/A" >> $GITHUB_ENV
            echo "IS_ZIP=false" >> $GITHUB_ENV
          fi
          echo "SELECTED_FILE=${SPECIFIED_ZIP:-$CHOSEN_ZIP}" >> $GITHUB_ENV

      - name: "3. Create Fresh Isolated Workspace and Extract"
        run: |
          ISOLATED_DIR="${{ runner.temp }}/isolated_build_workspace_$(date +%s)"
          rm -rf "$ISOLATED_DIR"
          mkdir -p "$ISOLATED_DIR"
          
          if [ "$IS_ZIP" = "true" ]; then
            unzip -q -o "$TRANSFERRED_FILE" -d "$ISOLATED_DIR"
          else
            rsync -av --exclude='.git' --exclude='.github' ./ "$ISOLATED_DIR/"
          fi
          echo "EXTRACTED_PATH=$ISOLATED_DIR" >> $GITHUB_ENV

      - name: "4. Detect True Project Root and Settings"
        run: |
          SETTINGS_FILE=$(find "$EXTRACTED_PATH" -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -n 1)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "CRITICAL ERROR: Could not locate settings.gradle or settings.gradle.kts!"
            exit 1
          fi
          
          REAL_ROOT=$(dirname "$SETTINGS_FILE")
          PROJECT_NAME=$(grep -oE 'rootProject\.name\s*=\s*["'"'"'][^"'"'"']+["'"'"']' "$SETTINGS_FILE" | sed -E 's/rootProject\.name\s*=\s*["'"'"']([^"'"'"']+)["'"'"']/\1/' | head -n 1)
          if [ -z "$PROJECT_NAME" ]; then
            PROJECT_NAME="AndroidApp"
          fi

          WRAPPER_PROP="$REAL_ROOT/gradle/wrapper/gradle-wrapper.properties"
          DETECTED_GRADLE="9.3.1"
          if [ -f "$WRAPPER_PROP" ]; then
            PARSED_VER=$(grep -oE 'gradle-[0-9]+\.[0-9]+(\.[0-9]+)?' "$WRAPPER_PROP" | sed 's/gradle-//' | head -n 1)
            if [ -n "$PARSED_VER" ]; then
              DETECTED_GRADLE="$PARSED_VER"
            fi
          fi

          echo "========================================================"
          echo "MANDATORY AUDIT PROOF LOGS:"
          echo "SELECTED_FILE=$SELECTED_FILE"
          echo "TRANSFERRED_FILE=$TRANSFERRED_FILE"
          echo "TRANSFERRED_FILE_SIZE=$TRANSFERRED_FILE_SIZE"
          echo "EXTRACTED_PATH=$EXTRACTED_PATH"
          echo "PROJECT_ROOT=$REAL_ROOT"
          echo "ROOT_PROJECT_NAME=$PROJECT_NAME"
          echo "DETECTED_GRADLE=$DETECTED_GRADLE"
          echo "========================================================"

          echo "PROJECT_ROOT=$REAL_ROOT" >> $GITHUB_ENV
          echo "ROOT_PROJECT_NAME=$PROJECT_NAME" >> $GITHUB_ENV
          echo "DETECTED_GRADLE=$DETECTED_GRADLE" >> $GITHUB_ENV

      - name: "5. Set up JDK 17"
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: "5.1 Pre-accept Android SDK Licenses"
        run: |
          echo "Pre-accepting all Android SDK licenses..."
          for base_dir in "$ANDROID_HOME" "$ANDROID_SDK_ROOT" "/usr/local/lib/android/sdk"; do
            if [ -n "$base_dir" ] && [ -d "$base_dir" ]; then
              mkdir -p "$base_dir/licenses"
              printf "8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b68ba51e3cbe33f00640d85997579f\n" > "$base_dir/licenses/android-sdk-license"
              printf "84831b9409646a918e30573bab4c9c91346d8abd\n" > "$base_dir/licenses/android-sdk-preview-license"
              printf "601085b94cd77f0b54ff864069570991500085d7\n" > "$base_dir/licenses/android-googletv-license"
              printf "33b6a2b64907970da36f5f4dc2f2d05049180096\n" > "$base_dir/licenses/google-gdk-license"
              printf "d975f751698a77b662f1254ddbeed3901e976f5a\n" > "$base_dir/licenses/intel-android-extra-license"
              printf "e9acab583f157608460670ea400d490aa1769c30\n" > "$base_dir/licenses/mips-android-extra-license"
              printf "859f317696f67ef43acde8027259b83c25e31db2\n" > "$base_dir/licenses/android-sdk-arm-dbt-license"
            fi
          done

      - name: "6. Setup Android SDK"
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: false
          packages: ''

      - name: "6.1 Verify All Android SDK Licenses"
        run: |
          echo "========================================================"
          echo "VERIFYING ALL ANDROID SDK LICENSES"
          echo "========================================================"
          if command -v sdkmanager &> /dev/null; then
            yes | sdkmanager --licenses || true
          fi
          for base_dir in "$ANDROID_HOME" "$ANDROID_SDK_ROOT" "/usr/local/lib/android/sdk"; do
            if [ -n "$base_dir" ] && [ -d "$base_dir" ]; then
              SDK_BIN=$(find "$base_dir" -name sdkmanager -type f 2>/dev/null | head -n 1)
              if [ -n "$SDK_BIN" ] && [ -x "$SDK_BIN" ]; then
                yes | "$SDK_BIN" --licenses || true
              fi
            fi
          done
          echo "All Android SDK licenses verified successfully."

      - name: "7. Setup Gradle"
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.DETECTED_GRADLE }}

      - name: "8. Prepare Local Environment"
        run: |
          cd "$PROJECT_ROOT"
          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          touch .env .env.example local.properties
          if [ -n "$ANDROID_HOME" ]; then
            echo "sdk.dir=$ANDROID_HOME" >> local.properties
          fi

      - name: "9. Execute Verified Build"
        run: |
          cd "$PROJECT_ROOT"
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: "10. Upload Debug APK"
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: "${{ env.ROOT_PROJECT_NAME }}-debug-apk"
          path: "${{ env.PROJECT_ROOT }}/**/build/outputs/apk/debug/*.apk"
          retention-days: 14
