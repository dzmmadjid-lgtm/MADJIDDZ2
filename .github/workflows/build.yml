name: Android CI — Dynamic ZIP & Gradle APK Build

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Extract Project, Detect Gradle Root & Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK, Accept Licenses & Install Required Packages
        shell: bash
        run: |
          set -euo pipefail

          # 1. Resolve Android SDK Root on GitHub Ubuntu Runner
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK_DIR" ]; then
            mkdir -p "$SDK_DIR"
          fi

          export ANDROID_HOME="$SDK_DIR"
          export ANDROID_SDK_ROOT="$SDK_DIR"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"

          # 2. Locate the correct sdkmanager binary (preferring cmdline-tools/latest)
          SDKMANAGER=""
          if [ -x "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER=$(find "$SDK_DIR/cmdline-tools" -type f -name "sdkmanager" 2>/dev/null | sort -V | tail -n 1 || true)
          fi
          if [ -z "$SDKMANAGER" ] && [ -x "$SDK_DIR/tools/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_DIR/tools/bin/sdkmanager"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "cmdline-tools sdkmanager not found in $SDK_DIR; bootstrapping commandlinetools..."
            CMDLINE_ZIP="$RUNNER_TEMP/commandlinetools.zip"
            curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o "$CMDLINE_ZIP"
            mkdir -p "$SDK_DIR/cmdline-tools"
            unzip -q -o "$CMDLINE_ZIP" -d "$SDK_DIR/cmdline-tools"
            mv "$SDK_DIR/cmdline-tools/cmdline-tools" "$SDK_DIR/cmdline-tools/latest"
            SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
            chmod +x "$SDKMANAGER"
          fi

          echo "Using sdkmanager binary: $SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_DIR/platform-tools" >> "$GITHUB_PATH"

          # 3. Pre-populate official Google license hashes AND run non-interactive yes | sdkmanager --licenses
          mkdir -p "$SDK_DIR/licenses"
          printf "\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n859f317696f67ef3d7f30a50a5560e7834b43903\n" > "$SDK_DIR/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b84351f2910\n" > "$SDK_DIR/licenses/android-sdk-preview-license"

          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_DIR" --licenses > /dev/null
          set -o pipefail
          echo "All Android SDK licenses accepted non-interactively."

          # 4. Install only the Android SDK packages required by the project (compileSdk 34 / build-tools 34.0.0)
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_DIR" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" > /dev/null
          set -o pipefail
          echo "Required Android SDK packages installed: platform-tools, platforms;android-34, build-tools;34.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Locate ZIP, Extract & Recursively Detect PROJECT_ROOT
        id: detect_root
        shell: bash
        run: |
          set -euo pipefail

          WORKSPACE_DIR="${GITHUB_WORKSPACE:-$(pwd)}"
          EXTRACTED_PATH="$RUNNER_TEMP/extracted_android_project"
          rm -rf "$EXTRACTED_PATH"
          mkdir -p "$EXTRACTED_PATH"

          echo "=== Step 1: Dynamic ZIP Selection ==="
          ZIP_FILE=$(find "$WORKSPACE_DIR" -maxdepth 3 -type f -name "*.zip" \
            ! -path "*/.git/*" \
            ! -path "*/node_modules/*" \
            ! -path "*/build/*" \
            -printf "%T@ %p\n" 2>/dev/null | sort -nr | head -n 1 | cut -d' ' -f2- || true)

          if [ -n "${ZIP_FILE:-}" ] && [ -f "$ZIP_FILE" ]; then
            echo "Found ZIP archive: $ZIP_FILE"
            unzip -q -o "$ZIP_FILE" -d "$EXTRACTED_PATH"

            # Handle nested ZIP inside the outer ZIP if present and no settings file at first pass
            INITIAL_SETTINGS=$(find "$EXTRACTED_PATH" -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) ! -path "*/__MACOSX/*" | head -n 1 || true)
            if [ -z "$INITIAL_SETTINGS" ]; then
              NESTED_ZIP=$(find "$EXTRACTED_PATH" -type f -name "*.zip" ! -path "*/__MACOSX/*" | head -n 1 || true)
              if [ -n "$NESTED_ZIP" ]; then
                echo "Detected nested ZIP archive: $NESTED_ZIP — extracting..."
                unzip -q -o "$NESTED_ZIP" -d "$EXTRACTED_PATH/nested_extracted"
              fi
            fi
          else
            echo "No .zip archive found in repository. Copying workspace into $EXTRACTED_PATH for unified detection..."
            rsync -a --exclude='.git' --exclude='node_modules' "$WORKSPACE_DIR/" "$EXTRACTED_PATH/"
          fi

          echo "=== Step 2: Recursively Searching for settings.gradle or settings.gradle.kts ==="
          # Find all settings.gradle / settings.gradle.kts files, sorted by shallowest directory depth first
          SETTINGS_FILE=$(find "$EXTRACTED_PATH" -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            ! -path "*/__MACOSX/*" \
            ! -path "*/.gradle/*" \
            ! -path "*/build/*" \
            -printf "%d\t%p\n" 2>/dev/null | sort -n | head -n 1 | cut -f2- || true)

          if [ -z "${SETTINGS_FILE:-}" ] || [ ! -f "$SETTINGS_FILE" ]; then
            echo "=================================================================="
            echo "CRITICAL ERROR: Could not locate settings.gradle or settings.gradle.kts!"
            echo "Dumping extracted directory structure ($EXTRACTED_PATH):"
            echo "=================================================================="
            find "$EXTRACTED_PATH" -maxdepth 5 ! -path "*/.git/*" -print || ls -laR "$EXTRACTED_PATH"
            echo "=================================================================="
            exit 1
          fi

          PROJECT_ROOT="$(cd "$(dirname "$SETTINGS_FILE")" && pwd)"
          echo "Detected Gradle settings file: $SETTINGS_FILE"
          echo "Resolved PROJECT_ROOT: $PROJECT_ROOT"

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"
          echo "SETTINGS_FILE=$SETTINGS_FILE" >> "$GITHUB_ENV"
          echo "project_root=$PROJECT_ROOT" >> "$GITHUB_OUTPUT"

      - name: Configure Android SDK & Prepare Gradle Wrapper in PROJECT_ROOT
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -euo pipefail
          echo "Running inside PROJECT_ROOT: $(pwd)"

          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "sdk.dir=$SDK_DIR" > local.properties

          echo "Configured local.properties:"
          cat local.properties || true

          # Ensure Gradle Wrapper exists or generate it using setup-gradle
          if [ ! -f "./gradlew" ]; then
            echo "gradlew not found in PROJECT_ROOT. Generating Gradle Wrapper..."
            gradle wrapper --gradle-version 8.6 --distribution-type bin
          fi
          chmod +x ./gradlew

      - name: Build Debug APK from PROJECT_ROOT
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -euo pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate Built APK & Verify Output
        id: locate_apk
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -euo pipefail
          APK_PATH=$(find . -type f -path "*/outputs/apk/*.apk" | head -n 1 || true)
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: Build completed but no APK file was found under outputs/apk/!"
            find . -maxdepth 4 -print
            exit 1
          fi
          echo "Successfully built APK: $APK_PATH"
          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"

      - name: Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrimsonPDF-Reconstruct-Debug-APK
          path: ${{ env.PROJECT_ROOT }}/**/outputs/apk/**/*.apk
          if-no-files-found: error
